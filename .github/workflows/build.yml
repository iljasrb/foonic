name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # fooyin's dev files (headers + FooyinConfig.cmake + libs) are only packaged on Arch,
    # so build inside an Arch container rather than building fooyin from source on Ubuntu.
    # Use Google's Docker Hub mirror: GitHub runners share IPs and hit Docker Hub's
    # anonymous pull rate limit on archlinux:latest.
    container: mirror.gcr.io/library/archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git ca-certificates qt6-base qt6-svg fooyin

      - uses: actions/checkout@v4

      - name: Record build versions
        id: versions
        shell: bash
        run: |
          fooyin_version="$(fooyin --version 2>/dev/null | head -n1 || true)"
          if [ -z "$fooyin_version" ]; then
            fooyin_version="fooyin $(pacman -Q fooyin | awk '{print $2}')"
          fi
          plugin_version="$(sed -n 's/.*project(foosonic VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          echo "fooyin=$fooyin_version" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin_version" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: fyplugin_foosonic
          path: build/fyplugin_foosonic.so
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          body: |
            Built against **${{ steps.versions.outputs.fooyin }}** (plugin version ${{ steps.versions.outputs.plugin }}).
          files: build/fyplugin_foosonic.so
