name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Build against Fedora 44's fooyin 0.14.1 (Qt 6.11), not Arch's rolling Qt.
    # A plugin tagged against Qt 6.12 fails to load on Fedora 44 and the Flatpak runtime (Qt 6.11)
    # with "version `Qt_6.12' not found".
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y cmake ninja-build gcc15-c++ git ca-certificates \
            qt6-qtbase-devel qt6-qtsvg-devel fooyin-devel

      - uses: actions/checkout@v4

      - name: Record build versions
        id: versions
        shell: bash
        run: |
          fooyin_version="$(fooyin --version 2>/dev/null | head -n1 || true)"
          if [ -z "$fooyin_version" ]; then
            fooyin_version="fooyin $(rpm -q --qf '%{VERSION}' fooyin-devel)"
          fi
          plugin_version="$(sed -n 's/.*project(foonic VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          echo "fooyin=$fooyin_version" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin_version" >> "$GITHUB_OUTPUT"

      - name: Configure
        # GCC 15 keeps the artifact loadable in the Flatpak runtime, whose libstdc++ (GCC 15)
        # lacks the GLIBCXX_3.4.35 symbol emitted by GCC 16.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-15 -DFOONIC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: fyplugin_foonic
          path: build/fyplugin_foonic.so
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          body: |
            Built against **${{ steps.versions.outputs.fooyin }}** (plugin version ${{ steps.versions.outputs.plugin }}).
          files: build/fyplugin_foonic.so
