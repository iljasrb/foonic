name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Fedora 44 ships fooyin 0.14 / Qt 6.11 (the Flatpak runtime baseline).
        # Fedora 45 tracks the current upstream fooyin / distro Qt.
        fedora: [44, 45]
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y cmake ninja-build gcc-c++ git ca-certificates \
            qt6-qtbase-devel qt6-qtsvg-devel fooyin-devel

      - uses: actions/checkout@v4

      - name: Record build versions
        id: versions
        shell: bash
        run: |
          fooyin_version="$(fooyin --version 2>/dev/null | head -n1 || true)"
          if [ -z "$fooyin_version" ]; then
            fooyin_version="fooyin $(rpm -q --qf '%{VERSION}' fooyin-devel)"
          fi
          plugin_version="$(sed -n 's/.*project(foonic VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          echo "fooyin=$fooyin_version" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin_version" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFOONIC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: fyplugin_foonic-fedora${{ matrix.fedora }}
          path: build/fyplugin_foonic.so
          if-no-files-found: error

      - name: Attach Fedora 44 build to release
        if: startsWith(github.ref, 'refs/tags/') && matrix.fedora == 44
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          body: |
            Built against **${{ steps.versions.outputs.fooyin }}** (plugin version ${{ steps.versions.outputs.plugin }}).
          files: build/fyplugin_foonic.so
